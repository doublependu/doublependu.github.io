###########################################################
### Site settings for Rad Note (Beautiful Jekyll theme)
### Full list of options: https://github.com/daattali/beautiful-jekyll/blob/master/_config.yml
###########################################################

# --- Required options --- #

title: Rad Note
author: doublependu
description: >-
  Notes on self-hosting, AI experiments, and whatever else I break this week.

url: "https://doublependu.github.io"
baseurl: ""

# --- Navigation bar --- #

navbar-links:
  Posts: "/"
  Tags: "tags"
  About: "about"

# Uncomment once you drop a square image at assets/images/avatar.png
#avatar: "/assets/images/avatar.png"
#round-avatar: true

# --- Footer social media links --- #

social-network-links:
  github: doublependu
  rss: true
  # email: "you@example.com"   # uncomment if you want a public contact address

rss-description: >-
  Self-hosting, AI experiments, and side projects.

# --- General options --- #

share-links-active:
  twitter: true
  linkedin: true
  reddit: true
  facebook: false

url-pretty: "doublependu.github.io"
title-on-all-pages: true
excerpt_length: 40
feed_show_excerpt: true
feed_show_tags: true
post_search: true
edit_page_button: false

keywords: "self-hosting,homelab,AI,Claude,Blender,game development,Jekyll"

# --- Colours --- #

page-col: "#FFFFFF"
text-col: "#2B2B2B"
link-col: "#0B7285"
hover-col: "#12909E"
navbar-col: "#1B2430"
navbar-text-col: "#E8EDF2"
navbar-border-col: "#1B2430"
footer-col: "#1B2430"
footer-text-col: "#9AA7B4"
footer-link-col: "#E8EDF2"
footer-hover-col: "#4DD0C7"
mobile-theme-col: "#1B2430"

site-css:
  - "/assets/css/custom.css"

# --- `jekyll post` / `jekyll draft` scaffolding (jekyll-compose) --- #
# Local CLI helper only; GitHub Pages never reads this.
jekyll_compose:
  auto_open: false
  default_front_matter:
    posts:
      subtitle:
      categories: blog
      tags: []
      cover-img:
      thumbnail-img:
    drafts:
      subtitle:
      categories: blog
      tags: []

# --- Misc --- #

date_format: "%B %-d, %Y"
timezone: "Australia/Sydney"

# --- Build settings --- #

remote_theme: daattali/beautiful-jekyll@6.0.1
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

plugins:
  - jekyll-feed
  - jekyll-remote-theme
  - jekyll-sitemap

# Beautiful Jekyll's own config is not inherited by remote themes,
# so its layout defaults have to be repeated here.
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      social-share: true
      readtime: true
  -
    scope:
      path: ""
    values:
      layout: "page"

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
